name: kernel toolchain probe

# Validates the Darwin 22 kernel build path on a GitHub macOS runner:
#   * installs the public KDK that matches the runner's macOS build
#   * checks the CTF tools the XNU build wants
#   * assembles the pinned XNU source with the houji patch and overlay
#   * attempts the kernel build and publishes the log tail
#
# The runner image has Xcode but no KDK; dortania/KdkSupportPkg publishes the
# Kernel Debug Kit as a plain release asset, so no Apple ID is involved.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and inspect the KDK disk image
        run: |
          set -uo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kdk.dmg" \
            "https://github.com/dortania/KdkSupportPkg/releases/download/25G83/Kernel_Debug_Kit_26.6.2_build_25G83.dmg"
          ls -l "$RUNNER_TEMP/kdk.dmg"
          file "$RUNNER_TEMP/kdk.dmg"
          echo "== imageinfo =="
          hdiutil imageinfo "$RUNNER_TEMP/kdk.dmg" 2>&1 | head -30
          echo "== attach =="
          hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/kdk.dmg" 2>&1 | tail -10
          echo "== volumes =="
          ls /Volumes
          echo "== find pkg =="
          find /Volumes -maxdepth 3 -name '*.pkg' 2>/dev/null | head -5
          echo "== find kdk executables on mounted volumes =="
          find /Volumes -maxdepth 6 -name 'ctfconvert' 2>/dev/null | head -3

      - name: Install the KDK package
        run: |
          set -uo pipefail
          vol=$(ls -d /Volumes/*[Kk]ernel*[Dd]ebug* 2>/dev/null | head -1)
          if [ -z "$vol" ]; then vol=$(ls -d /Volumes/*/ 2>/dev/null | grep -v -E '^/Volumes/(Macintosh|Recovery)' | head -1); fi
          echo "volume: $vol"
          pkg=$(ls "$vol"/*.pkg 2>/dev/null | head -1)
          echo "pkg: $pkg"
          if [ -n "$pkg" ]; then
            sudo installer -pkg "$pkg" -target / 2>&1 | tail -10
          fi
          hdiutil detach "$vol" -quiet 2>/dev/null || true
          echo "== installed KDKs =="
          ls /Library/Developer/KDKs 2>/dev/null || echo MISSING
          kdk=$(ls -d /Library/Developer/KDKs/*.kdk 2>/dev/null | head -1)
          echo "kdk root: $kdk"
          if [ -n "$kdk" ]; then
            ls "$kdk"
            find "$kdk" -maxdepth 5 -name 'ctf*' 2>/dev/null | head -10
            find "$kdk" -maxdepth 5 -name 'KernelSupport' -type d 2>/dev/null | head -3
          fi

      - name: Clone the pinned XNU revision
        run: |
          set -euo pipefail
          git init xnu
          git -C xnu remote add origin https://github.com/apple-oss-distributions/xnu.git
          git -C xnu fetch --depth 1 origin 1b191cb58250d0705d8a51287127505aa4bc0789
          git -C xnu checkout -q FETCH_HEAD
          git -C xnu rev-parse HEAD

      - name: Assemble the kernel source tree
        run: python3 tools/prepare-sources.py kernel --upstream xnu --output .deps/kernel

      - name: Attempt the kernel build
        env:
          HOUJI_XNU: ${{ github.workspace }}/.deps/kernel
          HOUJI_BUILD_ROOT: ${{ github.workspace }}/out/kernel
          HOUJI_JOBS: "6"
        run: |
          set +e
          kdk=$(ls -d /Library/Developer/KDKs/*.kdk 2>/dev/null | head -1)
          export HOUJI_KDK="$kdk"
          mkdir -p .fakeroot/usr/local/bin
          for t in ctfconvert ctfmerge ctfdump; do
            found=$(find "$kdk" -name "$t" -type f 2>/dev/null | head -1)
            echo "$t -> ${found:-MISSING}"
            if [ -n "$found" ]; then ln -sf "$found" ".fakeroot/usr/local/bin/$t"; fi
          done
          export HOUJI_FAKEROOT="$PWD/.fakeroot"
          mkdir -p "$HOUJI_BUILD_ROOT"
          bash tools/build-kernel.sh > "$RUNNER_TEMP/kernel-build.log" 2>&1
          rc=$?
          echo "build exit: $rc"
          echo "===== log head ====="
          head -60 "$RUNNER_TEMP/kernel-build.log"
          echo "===== log tail ====="
          tail -200 "$RUNNER_TEMP/kernel-build.log"
          cp "$RUNNER_TEMP/kernel-build.log" "$GITHUB_WORKSPACE/kernel-build.log" 2>/dev/null
          exit 0

      - name: Kernel artifacts
        if: always()
        run: |
          find out -maxdepth 5 -type f \( -name '*.log' -o -name 'mach.*' -o -name 'kernel*' \) -printf '%10s %p\n' 2>/dev/null | sort -rn | head -20

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: |
            kernel-build.log
            .deps/kernel/.houji-source.json
          if-no-files-found: warn
